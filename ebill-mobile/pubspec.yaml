name: ebill_mobile
description: Aplicación móvil de facturación electrónica - Sistema eBill
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # HTTP Client
  dio: ^5.4.0
  json_annotation: ^4.8.1

  # Local Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.2

  # Dependency Injection
  get_it: ^7.6.4

  # Routing
  go_router: ^13.0.0

  # Functional Programming
  dartz: ^0.10.1

  # Utilities
  intl: ^0.19.0
  uuid: ^4.2.1
  logger: ^2.0.2+1
  path_provider: ^2.1.2
  share_plus: ^7.2.2
  pdfx: ^2.6.0

  # UI
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  pull_to_refresh: ^2.0.0
  url_launcher: ^6.2.5
  google_fonts: ^8.0.2
  local_auth: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

  # Code Generation
  build_runner: ^2.4.7
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
