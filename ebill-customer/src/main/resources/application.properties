server.port=8180
spring.jpa.database=postgresql
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.default_schema=public
spring.jackson.default-property-inclusion=NON_NULL
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=900000
# Flyway
spring.flyway.locations=classpath:flyway
spring.flyway.schemas=public
spring.flyway.baselineOnMigrate=true
spring.flyway.table=FLYWAY
spring.flyway.fail-on-missing-locations=true
spring.flyway.validate-migration-naming=true
# Crypto
crypto.master-password=${CRYPTO_MASTER_PASSWORD}
# Logging
logging.level.com.sun.mail=WARN
logging.level.javax.mail=WARN
# Cache / Redis
spring.cache.type=redis
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false
spring.cache.redis.key-prefix=ebill-customer::
spring.cache.redis.use-key-prefix=true
spring.data.redis.host=redis
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.timeout=5000
# Multipart
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB