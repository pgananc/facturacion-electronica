# Other properties
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# TLS
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# flyway:
# locations of migrations scripts
spring.flyway.locations=classpath:flyway
# schemas to update
spring.flyway.schemas=public
# JDBC url if you want Flyway to create its own DataSource
spring.flyway.url=${spring.datasource.url}
# JDBC username if you want Flyway to create its own DataSource
spring.flyway.user=${spring.datasource.username}
# JDBC password if you want Flyway to create its own DataSource
spring.flyway.password=${spring.datasource.password}
spring.flyway.baselineOnMigrate=true
spring.flyway.table=FLYWAY
spring.flyway.fail-on-missing-locations=true
spring.flyway.validate-migration-naming=true
spring.jpa.properties.hibernate.default_schema=public

logging.level.com.wallparisoft.ebill.auth.util.config=DEBUG
logging.level.com.wallparisoft.ebill.utils=DEBUG

# Redis configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.timeout=5000

# ebill-customer
service.customer.base-url=http://localhost:8180

# ebill-billing (Feature validation and subscription management)
ebill.billing.url=http://localhost:8480

# Session management - Invoice Point Sessions (localhost config)
# ⚡ MODO TESTING: Timeout de 10 MINUTOS para desarrollo
# Frontend enviando heartbeat cada 2 min (120 seg)
# Si para el heartbeat, expira en ~10-11 minutos (timeout + próxima limpieza)
session.inactivity.timeout.seconds=600
# Limpieza cada 20 segundos en local (súper frecuente para testing inmediato)
# Formato cron: segundos minutos horas días meses días-semana
# "*/20 * * * * *" = cada 20 segundos
session.cleanup.cron=*/20 * * * * *
