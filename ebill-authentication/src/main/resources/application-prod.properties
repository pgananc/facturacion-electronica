spring.datasource.url=jdbc:postgresql://172.18.0.1:5432/ebill_auth
spring.datasource.username=auth_user
spring.datasource.password=${DB_AUTH_PROD_PASS}
spring.mail.host=smtp.zoho.com
spring.mail.port=465
spring.mail.username=notificaciones@wallparisoft.com
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.debug=false
spring.mail.protocol=smtps
# Other properties
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# TLS
spring.mail.properties.mail.smtp.starttls.enable=true
# Redis configuration (Redis compartido en Docker)
spring.data.redis.host=redis
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.timeout=5000
# ebill-customer
service.customer.base-url=http://ebill-customer:8180
# ebill-billing (Feature validation and subscription management)
ebill.billing.url=http://ebill-billing:8480
# Session management - PROD
# Tiempo de inactividad permitido antes de liberar la sesion
# 600 segundos = 10 minutos
session.inactivity.timeout.seconds=600
# Cron limpieza automatica (cada 3 minutos)
session.cleanup.cron=0 */3 * * * *
app.cors.allowed-origins=https://facturacion.wallparisoft.com,https://wallparisoft.com,https://*.vercel.app