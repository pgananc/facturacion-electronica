server.port=8280
spring.jpa.database=postgresql
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update

spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.idle-timeout=900000

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jackson.default-property-inclusion=NON_NULL
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

spring.mail.default-encoding=UTF-8
spring.mail.host=smtp.zoho.com
spring.mail.port=465
spring.mail.properties.mail.debug=false
spring.mail.protocol=smtps
# Other properties
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# TLS
spring.mail.properties.mail.smtp.starttls.enable=true
# flyway:
#locations of migrations scripts
spring.flyway.locations=classpath:flyway
# schemas to update
spring.flyway.schemas=public
# JDBC url if you want Flyway to create its own DataSource
spring.flyway.url=${spring.datasource.url}
# JDBC username if you want Flyway to create its own DataSource
spring.flyway.user=${spring.datasource.username}
# JDBC password if you want Flyway to create its own DataSource
spring.flyway.password=${spring.datasource.password}
spring.flyway.baselineOnMigrate=true
spring.flyway.table=FLYWAY
spring.flyway.fail-on-missing-locations=true
spring.flyway.validate-migration-naming=true
spring.jpa.properties.hibernate.default_schema=public

logging.level.com.wallparisoft.ebill.auth.util=ERROR

feign.client.config.default.connectTimeout=3000
feign.client.config.default.readTimeout=5000

# Session management - Invoice Point Sessions
# Tiempo de inactividad permitido antes de liberar la sesion (en SEGUNDOS)
# Si el usuario no envia heartbeat en este tiempo, se libera automaticamente el punto
# 600 segundos = 10 minutos (frontend debe enviar heartbeat cada 2-3 minutos)
session.inactivity.timeout.seconds=600
# Cron para ejecutar limpieza automatica (cada 3 minutos para ser mas responsivo)
# Formato: segundos minutos horas dias meses dias-de-semana
# "0 */3 * * * *" = cada 3 minutos
session.cleanup.cron=0 */3 * * * *

# Session Fingerprint - Seguridad de sesion
# Maximo de horas de inactividad antes de eliminar fingerprint de sesion
# 24 horas = 1 dia (despues de este tiempo sin actividad, el usuario debera hacer login de nuevo)
session.fingerprint.max-inactive-hours=24
# Cron para limpieza de fingerprints inactivos (cada hora)
# "0 0 * * * *" = cada hora, al minuto 0
session.fingerprint.cleanup.cron=0 0 * * * *

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never