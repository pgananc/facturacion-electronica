<div class="text-center">
  <mat-toolbar color="primary">
    <mat-panel-title style="color: #fff">Compañías</mat-panel-title>
  </mat-toolbar>
</div>

<div class="principal-container mat-elevation-z8">
  <!-- Mensaje de advertencia si existe -->
  <mat-card *ngIf="warningMessage" class="warning-card">
    <mat-card-content>
      <div class="warning-content">
        <mat-icon class="warning-icon">warning</mat-icon>
        <span class="warning-text">{{ warningMessage }}</span>
      </div>
    </mat-card-content>
  </mat-card>

  <p class="subtitle">
    Seleccione la compañía y sucursal con la que desea trabajar
  </p>

  <!-- Vista de cards para mejor responsive -->
  <div class="companies-list">
    <div *ngFor="let company of companyDataSource.data" class="company-card">
      <!-- Header de la card -->
      <div class="card-header">
        <mat-icon class="company-icon">business</mat-icon>
        <h3 class="company-name">{{ company.name }}</h3>
      </div>

      <!-- Body de la card -->
      <div class="card-body">
        <mat-form-field appearance="outline" class="establishment-field">
          <mat-label>Seleccione una sucursal</mat-label>
          <mat-icon matPrefix class="field-icon">store</mat-icon>
          <mat-select
            [(value)]="selectedEstablishmentIds[company.idCompany]"
            (selectionChange)="onEstablishmentChange(company.idCompany, $event.value)"
          >
            <mat-option
              *ngFor="let e of getActiveEstablishments(company.establishments)"
              [value]="e.idEstablishment"
            >
              <div class="establishment-option">
                <span class="establishment-name">{{ company.name }} - {{ e.code }} - {{ e.address }}</span>
              </div>
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <!-- Footer de la card -->
      <div class="card-footer">
        <button
          mat-raised-button
          color="primary"
          [disabled]="!selectedEstablishmentIds[company.idCompany]"
          (click)="selectCompany(company)"
          class="select-button"
        >
          <mat-icon>check_circle</mat-icon>
          Seleccionar
        </button>
      </div>
    </div>

    <!-- Empty state -->
    <div
      class="empty-state"
      *ngIf="!companyDataSource.data || companyDataSource.data.length === 0"
    >
      <mat-icon>business_center</mat-icon>
      <p>No hay compañías disponibles</p>
    </div>
  </div>
</div>
