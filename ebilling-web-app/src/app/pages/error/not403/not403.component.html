<div class="invoice-page">
  <mat-toolbar class="toolbar-primary">
    <span>Acceso Denegado</span>
  </mat-toolbar>

  <mat-card class="card-padding mt-24 search-card">
    <mat-card-content>
      <!-- Mensaje para error de token de cliente -->
      <div *ngIf="isClientTokenError" class="error-content">
        <h1 class="error-title">Acceso Denegado</h1>
      </div>

      <!-- Mensaje para usuario autenticado sin permisos -->
      <div *ngIf="!isClientTokenError && userName" class="error-content">
        <h1 class="error-title">Acceso Denegado</h1>
        <p class="error-message">
          ¡ {{ userName }} no tienes permisos para entrar !
        </p>
        <div class="actions">
          <button mat-raised-button color="primary" (click)="goToWelcome()">
            <mat-icon>home</mat-icon>
            Ir a Principal
          </button>
        </div>
      </div>

      <!-- Mensaje para usuario no autenticado -->
      <div *ngIf="!isClientTokenError && !userName" class="error-content">
        <h1 class="error-title">Acceso Denegado</h1>
        <p class="error-message">{{ errorMessage }}</p>
        <div class="actions">
          <button mat-raised-button color="primary" (click)="goToLogin()">
            <mat-icon>login</mat-icon>
            Ir a Login
          </button>
        </div>
      </div>
    </mat-card-content>
  </mat-card>
</div>
