<!-- Contenedor principal -->
<div class="establishment-page">
  <!-- Header principal con botón integrado -->
  <mat-toolbar class="toolbar-primary">
    <span class="toolbar-title">Gestión de Sucursales</span>
    <span class="toolbar-spacer"></span>
    <button
      mat-raised-button
      class="new-establishment-btn"
      matTooltip="Agregar nueva sucursal"
      (click)="openCreateDialog()"
    >
      <mat-icon>add_circle</mat-icon>
      <span>Nueva Sucursal</span>
    </button>
  </mat-toolbar>

  <!-- Panel de búsqueda -->
  <mat-card class="search-card">
    <mat-card-content>
      <form>
        <div class="search-grid-horizontal">
          <mat-form-field appearance="outline" class="search-field-compact">
            <mat-label>Código sucursal</mat-label>
            <mat-icon matPrefix>qr_code</mat-icon>
            <input
              matInput
              [(ngModel)]="searchCode"
              name="searchCode"
              placeholder="Ingrese código (ej: 001)"
            />
          </mat-form-field>

          <mat-form-field appearance="outline" class="search-field-compact">
            <mat-label>Nombre</mat-label>
            <mat-icon matPrefix>business</mat-icon>
            <input
              matInput
              [(ngModel)]="searchName"
              name="searchName"
              placeholder="Ingrese nombre de la sucursal"
            />
          </mat-form-field>

          <div class="search-actions">
            <button
              mat-raised-button
              color="primary"
              type="button"
              class="search-btn"
              (click)="applyFilters()"
            >
              <mat-icon>search</mat-icon>
              <span>Buscar</span>
            </button>
            <button
              mat-stroked-button
              type="button"
              class="clear-btn"
              (click)="clearFilters()"
            >
              <mat-icon>clear</mat-icon>
              <span>Limpiar</span>
            </button>
          </div>
        </div>
      </form>
    </mat-card-content>
  </mat-card>

  <!-- Tabla de sucursales -->
  <div class="table-wrapper">
    <mat-toolbar class="toolbar-primary-sm">Listado de Sucursales</mat-toolbar>

    <mat-table [dataSource]="dataSource" matSort class="bordered-table">
      <!-- Columna: Código -->
      <ng-container matColumnDef="code">
        <mat-header-cell *matHeaderCellDef mat-sort-header>
          Código
        </mat-header-cell>
        <mat-cell class="celda-ajustable" *matCellDef="let row">
          {{ row.code }}
        </mat-cell>
      </ng-container>

      <!-- Columna: Nombre -->
      <ng-container matColumnDef="name">
        <mat-header-cell *matHeaderCellDef mat-sort-header>
          Nombre
        </mat-header-cell>
        <mat-cell
          class="celda-ajustable"
          *matCellDef="let row"
          [matTooltip]="row.name || ''"
          matTooltipPosition="above"
        >
          {{ row.name }}
        </mat-cell>
      </ng-container>

      <!-- Columna: Dirección -->
      <ng-container matColumnDef="address">
        <mat-header-cell *matHeaderCellDef mat-sort-header>
          Dirección
        </mat-header-cell>
        <mat-cell
          class="celda-ajustable"
          *matCellDef="let row"
          [matTooltip]="row.address || ''"
          matTooltipPosition="above"
        >
          {{ row.address }}
        </mat-cell>
      </ng-container>

      <!-- Columna: Tipo -->
      <ng-container matColumnDef="type">
        <mat-header-cell *matHeaderCellDef mat-sort-header>
          Tipo
        </mat-header-cell>
        <mat-cell class="celda-ajustable" *matCellDef="let row">
          <span
            class="badge"
            [class.badge-matriz]="row.type === 'MATRIZ'"
            [class.badge-sucursal]="row.type === 'SUCURSAL'"
          >
            {{ row.type }}
          </span>
        </mat-cell>
      </ng-container>

      <!-- Columna: Estado -->
      <ng-container matColumnDef="status">
        <mat-header-cell *matHeaderCellDef mat-sort-header>
          Estado
        </mat-header-cell>
        <mat-cell *matCellDef="let row">
          <span
            class="badge"
            [class.badge-active]="row.status"
            [class.badge-inactive]="!row.status"
          >
            {{ row.status ? "Activo" : "Inactivo" }}
          </span>
        </mat-cell>
      </ng-container>

      <!-- Columna: Acciones -->
      <ng-container matColumnDef="actions">
        <mat-header-cell *matHeaderCellDef> Acciones </mat-header-cell>
        <mat-cell *matCellDef="let row" class="actions-cell">
          <div class="actions-container">
            <button
              mat-icon-button
              color="primary"
              matTooltip="Editar sucursal"
              (click)="openEditDialog(row)"
              class="action-btn edit-btn"
              [disabled]="isLoading"
            >
              <mat-icon>edit</mat-icon>
            </button>
            <button
              *ngIf="row.status"
              mat-icon-button
              color="warn"
              matTooltip="Eliminar sucursal"
              (click)="delete(row)"
              class="action-btn delete-btn"
              [disabled]="isLoading"
            >
              <mat-icon>delete</mat-icon>
            </button>
            <!-- Espacio reservado invisible cuando el botón de eliminar no está visible -->
            <span *ngIf="!row.status" class="action-spacer"></span>
          </div>
        </mat-cell>
      </ng-container>

      <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
      <mat-row *matRowDef="let row; columns: displayedColumns"></mat-row>

      <!-- Sin datos -->
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="displayedColumns.length">
          No existen sucursales registradas.
        </td>
      </tr>
    </mat-table>

    <mat-paginator
      [pageSize]="10"
      [pageSizeOptions]="[5, 10, 25, 50]"
    ></mat-paginator>
  </div>
</div>
